name: Feature request
description: Propose a scoped product or engineering improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    attributes:
      label: Problem
      description: Describe the user or operator problem, not only a proposed implementation.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Proposed outcome
    validations:
      required: true

  - type: textarea
    attributes:
      label: Alternatives considered

  - type: checkboxes
    attributes:
      label: Product boundaries
      options:
        - label: This preserves Worktree isolation and Admin-controlled integration.
          required: true
        - label: This does not require sharing one user's model credentials with another user.
          required: true
